services:
  subaru-starlink-api:
    build: .
    image: subaru-starlink-api:latest
    container_name: subaru-starlink-api
    restart: unless-stopped
    # Read from .env in the project root — kept out of the image and out of git.
    env_file: .env
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
